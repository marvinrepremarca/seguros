openapi: 3.0.3
info:
  title: Seguros — Catálogo
  version: 1.0.0
  description: |
    Aseguradoras, ramos, productos, esquemas de riesgo y acuerdos de comisión de la agencia.
    Los registros se desactivan, no se borran.
servers:
  - url: /
x-common: &pagination
  - { name: cursor, in: query, schema: { type: string, maxLength: 64 } }
  - { name: limit, in: query, schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 200 } }
paths:
  /api/v1/catalog/insurers:
    get:
      operationId: listInsurers
      x-permission: catalog.item.read
      parameters: *pagination
      responses:
        "200":
          description: Aseguradoras.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InsurerPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createInsurer
      x-permission: catalog.item.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNamedRequest" }
      responses:
        "201":
          description: Aseguradora creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Insurer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/catalog/insurers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateInsurer
      x-permission: catalog.item.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNamedRequest" }
      responses:
        "200":
          description: Aseguradora actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Insurer" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/catalog/lines-of-business:
    get:
      operationId: listLinesOfBusiness
      x-permission: catalog.item.read
      parameters: *pagination
      responses:
        "200":
          description: Ramos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createLineOfBusiness
      x-permission: catalog.item.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLineRequest" }
      responses:
        "201":
          description: Ramo creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineOfBusiness" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/catalog/lines-of-business/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateLineOfBusiness
      x-permission: catalog.item.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNamedRequest" }
      responses:
        "200":
          description: Ramo actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineOfBusiness" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/catalog/products:
    get:
      operationId: listProducts
      x-permission: catalog.item.read
      parameters: *pagination
      responses:
        "200":
          description: Productos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProduct
      x-permission: catalog.item.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProductRequest" }
      responses:
        "201":
          description: Producto creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/catalog/products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateProduct
      x-permission: catalog.item.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNamedRequest" }
      responses:
        "200":
          description: Producto actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/catalog/risk-schemas:
    get:
      operationId: listRiskSchemas
      summary: Esquemas de datos de riesgo vigentes (versionados, definidos por la plataforma).
      x-permission: catalog.item.read
      responses:
        "200":
          description: Esquemas.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RiskSchema" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/catalog/commission-agreements:
    get:
      operationId: listCommissionAgreements
      x-permission: catalog.commission-agreement.read
      parameters: *pagination
      responses:
        "200":
          description: Acuerdos de comisión.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgreementPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCommissionAgreement
      x-permission: catalog.commission-agreement.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgreementRequest" }
      responses:
        "201":
          description: Acuerdo creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionAgreement" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/catalog/commission-agreements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateCommissionAgreement
      x-permission: catalog.commission-agreement.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgreementRequest" }
      responses:
        "200":
          description: Acuerdo actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionAgreement" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  responses:
    Problem:
      description: Error (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        requestId: { type: string }
    CreateNamedRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
    UpdateNamedRequest:
      type: object
      required: [name, active, version]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        active: { type: boolean }
        version: { type: integer, format: int32, minimum: 1 }
    RiskSchemaKey: { type: string, enum: [auto, life, home, business, generic] }
    CreateLineRequest:
      type: object
      required: [name, riskSchemaKey]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        riskSchemaKey: { $ref: "#/components/schemas/RiskSchemaKey" }
    CreateProductRequest:
      type: object
      required: [name, insurerId, lineOfBusinessId]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        insurerId: { type: string, format: uuid }
        lineOfBusinessId: { type: string, format: uuid }
    Insurer:
      type: object
      required: [id, name, active, version]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        version: { type: integer, format: int32 }
    LineOfBusiness:
      type: object
      required: [id, name, riskSchemaKey, active, version]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        riskSchemaKey: { $ref: "#/components/schemas/RiskSchemaKey" }
        active: { type: boolean }
        version: { type: integer, format: int32 }
    Product:
      type: object
      required: [id, name, insurerId, lineOfBusinessId, active, version]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        insurerId: { type: string, format: uuid }
        lineOfBusinessId: { type: string, format: uuid }
        active: { type: boolean }
        version: { type: integer, format: int32 }
    RiskSchema:
      type: object
      required: [key, version, label, schema]
      additionalProperties: false
      properties:
        key: { $ref: "#/components/schemas/RiskSchemaKey" }
        version: { type: integer, format: int32 }
        label: { type: string }
        schema:
          type: object
          additionalProperties: true
    CommissionBasis: { type: string, enum: [paid_premium, written_premium] }
    CreateAgreementRequest:
      type: object
      required: [insurerId, lineOfBusinessId, percentage, validFrom, validTo]
      additionalProperties: false
      properties:
        insurerId: { type: string, format: uuid }
        lineOfBusinessId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        basis: { $ref: "#/components/schemas/CommissionBasis" }
        percentage: { type: string, format: decimal, pattern: '^\d{1,3}(\.\d{1,6})?$' }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
    UpdateAgreementRequest:
      type: object
      required: [basis, percentage, validFrom, validTo, version]
      additionalProperties: false
      properties:
        basis: { $ref: "#/components/schemas/CommissionBasis" }
        percentage: { type: string, format: decimal, pattern: '^\d{1,3}(\.\d{1,6})?$' }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        version: { type: integer, format: int32, minimum: 1 }
    CommissionAgreement:
      type: object
      required: [id, insurerId, lineOfBusinessId, basis, percentage, validFrom, validTo, version]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        insurerId: { type: string, format: uuid }
        lineOfBusinessId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        basis: { $ref: "#/components/schemas/CommissionBasis" }
        percentage: { type: string, format: decimal }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        version: { type: integer, format: int32 }
    InsurerPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Insurer" }
        nextCursor: { type: string }
    LinePage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LineOfBusiness" }
        nextCursor: { type: string }
    ProductPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        nextCursor: { type: string }
    AgreementPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CommissionAgreement" }
        nextCursor: { type: string }
