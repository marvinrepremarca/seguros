openapi: 3.0.3
info:
  title: Seguros — Pólizas
  version: 1.0.0
  description: |
    Póliza y su ciclo de vida (Flujos 3, 5 y 8). La agencia registra lo que expide la aseguradora.
    Los montos son strings decimales. Todo cambio envía la `version` que el cliente leyó.
    `read` y `read-own` se resuelven en el caso de uso: un asesor solo ve sus pólizas.
servers:
  - url: /
paths:
  /api/v1/policies/policies:
    get:
      operationId: listPolicies
      x-permission: "policies.policy.read|policies.policy.read-own"
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/PolicyStatus" } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 64 } }
        - { name: limit, in: query, schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Página de pólizas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPolicy
      summary: Registra una póliza en cotización (expedición manual).
      x-permission: policies.policy.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyTerms" }
      responses:
        "201": { $ref: "#/components/responses/Policy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/settings/renewal:
    get:
      operationId: getRenewalRules
      x-permission: policies.settings.manage
      responses:
        "200":
          description: Qué conserva una renovación.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenewalRules" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setRenewalRules
      x-permission: policies.settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenewalRules" }
      responses:
        "204": { description: Guardado. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/agents:
    get:
      operationId: listAgents
      summary: Usuarios de la agencia. Solo a los activos se les asigna cartera; requiere manage o assign.
      x-permission: "policies.policy.manage|policies.policy.assign"
      responses:
        "200":
          description: Asesores.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/portfolio-transfers:
    post:
      operationId: transferPortfolio
      summary: Pide pasar toda la cartera de un asesor a otro. Se procesa en segundo plano.
      x-permission: policies.policy.assign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferPortfolioRequest" }
      responses:
        "202": { description: Traspaso aceptado. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/policies/{policyId}/agent:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reassignPolicyAgent
      summary: Cambia el asesor de la póliza por otro activo. Queda en el historial con motivo.
      x-permission: policies.policy.assign
      parameters:
        - { $ref: "#/components/parameters/Version" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReassignAgentRequest" }
      responses:
        "200": { $ref: "#/components/responses/Policy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/policies/{policyId}:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPolicy
      x-permission: "policies.policy.read|policies.policy.read-own"
      responses:
        "200": { $ref: "#/components/responses/Policy" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updatePolicyTerms
      summary: Ajusta los datos antes de expedir.
      x-permission: policies.policy.manage
      parameters:
        - { $ref: "#/components/parameters/Version" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyTerms" }
      responses:
        "200": { $ref: "#/components/responses/Policy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/policies/{policyId}/accept:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: acceptPolicy
      summary: El cliente aceptó; pasa a trámite con la aseguradora.
      x-permission: policies.policy.manage
      parameters:
        - { $ref: "#/components/parameters/Version" }
      responses:
        "200": { $ref: "#/components/responses/Policy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/policies/{policyId}/reinstate:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reinstatePolicy
      summary: La aseguradora confirmó el pago; la póliza sale de mora (DECISIONS N24).
      x-permission: policies.policy.manage
      parameters:
        - { $ref: "#/components/parameters/Version" }
      responses:
        "200": { $ref: "#/components/responses/Policy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/policies/{policyId}/issue:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: issuePolicy
      summary: Registra la póliza expedida por la aseguradora. Exige KYC si module.compliance está encendido.
      description: Responde 503 `policies.issue.compliance_unavailable` si el flag no se puede evaluar (ADR 0012).
      x-permission: policies.policy.manage
      parameters:
        - { $ref: "#/components/parameters/Version" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyNumber]
              additionalProperties: false
              properties:
                policyNumber: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "200": { $ref: "#/components/responses/Policy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/policies/{policyId}/reject:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectPolicy
      summary: La aseguradora rechazó la solicitud.
      x-permission: policies.policy.manage
      parameters:
        - { $ref: "#/components/parameters/Version" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200": { $ref: "#/components/responses/Policy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/policies/{policyId}/renew:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: renewPolicy
      summary: Registra la nueva vigencia de una póliza, también antes de que venza (DECISIONS N17).
      x-permission: policies.policy.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyTerms" }
      responses:
        "201": { $ref: "#/components/responses/Policy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/policies/{policyId}/cancel:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelPolicy
      summary: Registra la cancelación que expidió la aseguradora.
      x-permission: policies.policy.cancel
      parameters:
        - { $ref: "#/components/parameters/Version" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelRequest" }
      responses:
        "200": { $ref: "#/components/responses/Policy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/policies/{policyId}/endorsements:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: requestEndorsement
      summary: Registra una solicitud de endoso (Flujo 5).
      x-permission: policies.endorsement.manage
      parameters:
        - { $ref: "#/components/parameters/Version" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestEndorsementRequest" }
      responses:
        "201": { $ref: "#/components/responses/Policy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/policies/{policyId}/endorsements/{endorsementId}/issue:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: endorsementId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: issueEndorsement
      summary: Registra el endoso emitido por la aseguradora y aplica sus efectos.
      x-permission: policies.endorsement.manage
      parameters:
        - { $ref: "#/components/parameters/Version" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueEndorsementRequest" }
      responses:
        "200": { $ref: "#/components/responses/Policy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/policies/policies/{policyId}/endorsements/{endorsementId}/reject:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: endorsementId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectEndorsement
      x-permission: policies.endorsement.manage
      parameters:
        - { $ref: "#/components/parameters/Version" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200": { $ref: "#/components/responses/Policy" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    Version:
      name: version
      in: query
      required: true
      description: Versión de la póliza que el cliente leyó (concurrencia optimista).
      schema: { type: integer, format: int32, minimum: 1 }
  responses:
    Problem:
      description: Error (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Policy:
      description: Póliza resultante.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Policy" }
  schemas:
    RenewalRules:
      type: object
      additionalProperties: false
      required: [keepHolder, keepLine]
      properties:
        keepHolder: { type: boolean }
        keepLine: { type: boolean }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        requestId: { type: string }
    PolicyStatus:
      type: string
      enum: [in_quotation, in_process, active, in_arrears, cancelled, expired, renewed, not_renewed, rejected]
    PaymentForm:
      type: string
      enum: [single_payment, monthly_installments, quarterly_installments, automatic_debit, premium_financing]
    PartyRole: { type: string, enum: [holder, insured, beneficiary] }
    Currency: { type: string, enum: [COP, USD, EUR] }
    Amount: { type: string, format: decimal, pattern: '^\d{1,15}(\.\d{1,4})?$' }
    SignedAmount: { type: string, format: decimal, pattern: '^-?\d{1,15}(\.\d{1,4})?$' }
    Agent:
      type: object
      required: [id, displayName, active]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        active: { type: boolean, description: "Habilitado y con rol de asesor: solo a estos se les asigna." }
    PolicyPartyInput:
      type: object
      required: [partyId, role]
      additionalProperties: false
      properties:
        partyId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/PartyRole" }
    CoverageInput:
      type: object
      required: [name, sumInsured]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        sumInsured: { $ref: "#/components/schemas/Amount" }
        deductible: { type: string, maxLength: 200 }
    InsuredItemInput:
      type: object
      required: [description, riskData]
      additionalProperties: false
      properties:
        description: { type: string, minLength: 2, maxLength: 200 }
        riskData:
          type: object
          additionalProperties: true
    PolicyTerms:
      type: object
      required: [insurerId, lineOfBusinessId, currency, netPremium, taxes, effectiveFrom, effectiveTo, paymentForm, parties, coverages, items]
      additionalProperties: false
      properties:
        insurerId: { type: string, format: uuid }
        lineOfBusinessId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        currency: { $ref: "#/components/schemas/Currency" }
        netPremium: { $ref: "#/components/schemas/Amount" }
        taxes: { $ref: "#/components/schemas/Amount" }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        paymentForm: { $ref: "#/components/schemas/PaymentForm" }
        parties:
          type: array
          minItems: 2
          maxItems: 100
          items: { $ref: "#/components/schemas/PolicyPartyInput" }
        coverages:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CoverageInput" }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/InsuredItemInput" }
    TransferReason:
      type: string
      description: Catálogo de motivos (DECISIONS N12). Con `other` la nota es obligatoria.
      enum: [employee_departure, role_change, prolonged_absence, portfolio_redistribution, client_request, branch_change, assignment_correction, other]
    ReassignAgentRequest:
      type: object
      required: [agentId, reason]
      additionalProperties: false
      properties:
        agentId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/TransferReason" }
        note: { type: string, maxLength: 200, description: "Opcional. Texto libre: no escriba datos de salud ni documentos." }
    TransferPortfolioRequest:
      type: object
      required: [fromAgentId, toAgentId, reason]
      additionalProperties: false
      properties:
        fromAgentId: { type: string, format: uuid }
        toAgentId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/TransferReason" }
        note: { type: string, maxLength: 200, description: "Opcional. Texto libre: no escriba datos de salud ni documentos." }
    ReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    CancellationCause:
      type: string
      enum: [client_request, item_sold, arrears, insurer_revocation, other]
    CancelRequest:
      type: object
      required: [cause, effectiveDate, unearnedPremium]
      additionalProperties: false
      properties:
        cause: { $ref: "#/components/schemas/CancellationCause" }
        effectiveDate: { type: string, format: date }
        unearnedPremium: { $ref: "#/components/schemas/Amount" }
        insurerReference: { type: string, maxLength: 60 }
    EndorsementType:
      type: string
      enum: [data_change, item_change, party_inclusion, party_exclusion, sum_insured_increase, sum_insured_decrease, other]
    RequestEndorsementRequest:
      type: object
      required: [type, description, effectiveDate]
      additionalProperties: false
      properties:
        type: { $ref: "#/components/schemas/EndorsementType" }
        description: { type: string, minLength: 3, maxLength: 500 }
        effectiveDate: { type: string, format: date }
    IssueEndorsementRequest:
      type: object
      required: [number, netPremiumDelta, taxesDelta]
      additionalProperties: false
      properties:
        number: { type: string, minLength: 1, maxLength: 60 }
        netPremiumDelta: { $ref: "#/components/schemas/SignedAmount" }
        taxesDelta: { $ref: "#/components/schemas/SignedAmount" }
        coverageChanges:
          type: array
          maxItems: 100
          items:
            type: object
            required: [coverageId, sumInsured]
            additionalProperties: false
            properties:
              coverageId: { type: string, format: uuid }
              sumInsured: { $ref: "#/components/schemas/Amount" }
        addParties:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/PolicyPartyInput" }
        removeParties:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/PolicyPartyInput" }
        itemChanges:
          type: array
          maxItems: 100
          items:
            type: object
            required: [itemId, riskData]
            additionalProperties: false
            properties:
              itemId: { type: string, format: uuid }
              riskData:
                type: object
                additionalProperties: true
    PolicyParty:
      type: object
      required: [partyId, role, name]
      additionalProperties: false
      properties:
        partyId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/PartyRole" }
        name: { type: string }
    Coverage:
      type: object
      required: [id, name, sumInsured]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sumInsured: { type: string, format: decimal }
        deductible: { type: string }
    InsuredItem:
      type: object
      required: [id, description, riskSchemaKey, riskSchemaVersion, riskData]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        riskSchemaKey: { type: string }
        riskSchemaVersion: { type: integer, format: int32 }
        riskData:
          type: object
          additionalProperties: true
    Endorsement:
      type: object
      required: [id, type, status, description, effectiveDate, requestedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/EndorsementType" }
        status: { type: string, enum: [requested, issued, rejected] }
        description: { type: string }
        effectiveDate: { type: string, format: date }
        requestedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        number: { type: string }
        netPremiumDelta: { type: string, format: decimal }
        taxesDelta: { type: string, format: decimal }
        rejectionReason: { type: string }
    Cancellation:
      type: object
      required: [cause, effectiveDate, unearnedPremium]
      additionalProperties: false
      properties:
        cause: { $ref: "#/components/schemas/CancellationCause" }
        effectiveDate: { type: string, format: date }
        unearnedPremium: { type: string, format: decimal }
        insurerReference: { type: string }
    Policy:
      type: object
      required: [id, status, insurerId, lineOfBusinessId, currency, netPremium, taxes, totalPremium, effectiveFrom, effectiveTo, paymentForm, parties, coverages, items, endorsements, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/PolicyStatus" }
        policyNumber: { type: string }
        insurerId: { type: string, format: uuid }
